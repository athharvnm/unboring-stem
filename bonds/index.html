  <!-- Google Fonts: Newsreader (editorial serif) + Inter (crisp UI sans) + JetBrains Mono -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
    rel="stylesheet"
  />

  <!-- KaTeX + mhchem extension for fast, reliable chemical typesetting -->

    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    crossorigin="anonymous"
  />
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"

    src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"
    crossorigin="anonymous"
  ></script>

  <style>
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #FAF8F5;
      color: #161A22;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .font-editorial {
      font-family: 'Newsreader', Georgia, Cambria, serif;
    }

    /* Custom accessible range slider styling */
    input[type='range'].chem-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #E5E7EB;
      outline: none;
      cursor: pointer;
    }

    input[type='range'].chem-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #161A22;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    input[type='range'].chem-slider::-webkit-slider-thumb:hover {
      transform: scale(1.08);
    }

    input[type='range'].chem-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #161A22;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
      cursor: pointer;
    }

    /* Canvas responsive container */
    .sim-canvas-wrap {
      position: relative;
      width: 100%;
      height: 56vh;
      min-height: 340px;
      max-height: 460px;
    }

    @media (min-width: 1024px) {
      .sim-canvas-wrap {
        height: 450px;
        max-height: none;
      }
    }

    canvas.bond-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
      user-select: none;
    }
    /* KaTeX responsive safety */
    .katex-display {
      margin: 0.25rem 0;
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }

    .katex {
      font-size: 1.02em;
    }
  </style>
</head>
<body class="bg-paper text-ink antialiased selection:bg-blue-100 selection:text-blue-900">
