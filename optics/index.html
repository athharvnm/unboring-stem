<script>
const TAU=Math.PI*2,$=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
let W=0,H=0,dpr=1,els=[],sel=null,drag=null,showGrid=true,showN=false,showV=true,density=15,showOR=true,showImg=true,insHidden=false,fc=0,lt=performance.now();

/* ---- Convention: every element lives in a local frame. Optical axis = local +x, aperture runs along local y.
   Angle 0 = upright element. Mirrors and screens present their working face to local -x (light arrives from the left). ---- */
const DEF={laser:{size:80},'point-light':{color:'#ffb703'},'plane-mirror':{size:160},'concave-mirror':{size:160,f:150},'convex-mirror':{size:160,f:-150},
 'convex-lens':{size:180,f:150},'concave-lens':{size:180,f:-150},'glass-slab':{size:140,depth:120},screen:{size:200},ruler:{size:250},object:{size:120,style:'bottle'}};
const LABEL={laser:'Parallel beam','point-light':'Point source','plane-mirror':'Plane mirror','concave-mirror':'Concave mirror','convex-mirror':'Convex mirror',
 'convex-lens':'Convex lens','concave-lens':'Concave lens','glass-slab':'Glass block',screen:'Screen',ruler:'Ruler',object:'Object'};
class El{constructor(t,x,y){this.id=Math.random().toString(36).slice(2,9);this.type=t;this.x=x;this.y=y;this.angle=0;
 Object.assign(this,{size:160,depth:120,f:150,n:1.5,spread:40,count:density,color:'#00ffcc',hits:[],lock:'shape',R:null},DEF[t]||{});}}
const isSrc=e=>e.type==='laser'||e.type==='point-light';
const curved=e=>e.type==='concave-mirror'||e.type==='convex-mirror';
const isLens=e=>e.type==='convex-lens'||e.type==='concave-lens';
const sag=(R,y)=>R-Math.sqrt(Math.max(R*R-y*y,0));
// Equiconvex lensmaker: 1/f = 2(n-1)/R.  'shape' mode: R is fixed glass (f follows n). 'f' mode: R is derived from f.
const trueR=e=>e.lock==='shape'&&e.R?e.R:2*(e.n-1)*Math.abs(e.f);
const lensR=e=>Math.max(trueR(e),e.size*1.3);   // drawing floor keeps wide lenses slim; the ray maths uses f only
const mirHW=e=>Math.min(e.size/2,Math.abs(2*e.f)*.98);
const g=v=>Math.round(v/20)*20;
function bounds(e){switch(e.type){
 case'object':return{hx:Math.max(e.size*.2,16),hy:e.size/2};case'laser':return{hx:22,hy:Math.max(15,e.size/2)};case'point-light':return{hx:16,hy:16};
 case'glass-slab':return{hx:e.depth/2,hy:e.size/2};case'ruler':return{hx:e.size/2,hy:16};
 case'convex-lens':case'concave-lens':return{hx:sag(lensR(e),e.size/2)+4,hy:e.size/2};
 case'concave-mirror':case'convex-mirror':return{hx:sag(Math.abs(2*e.f),mirHW(e))+12,hy:mirHW(e)};
 default:return{hx:14,hy:e.size/2};}}
const handleLocal=e=>{const b=bounds(e);return isSrc(e)?{x:b.hx+28,y:0}:{x:0,y:-b.hy-28}};
const toWorld=(e,lx,ly)=>{const c=Math.cos(e.angle),s=Math.sin(e.angle);return{x:e.x+lx*c-ly*s,y:e.y+lx*s+ly*c}};
const toLocal=(e,x,y)=>{const c=Math.cos(e.angle),s=Math.sin(e.angle),ox=x-e.x,oy=y-e.y;return{x:ox*c+oy*s,y:-ox*s+oy*c}};

/* ---- Ray/element intersection, performed in the element's local frame ---- */
function intersect(e,px,py,dx,dy){
 const c=Math.cos(e.angle),s=Math.sin(e.angle),ox=px-e.x,oy=py-e.y;
 const lx=ox*c+oy*s,ly=-ox*s+oy*c,ux=dx*c+dy*s,uy=-dx*s+dy*c,EPS=.05,hw=e.size/2;
 let best=null;
 const take=(t,nx,ny,y)=>{if(t>EPS&&(!best||t<best.t))best={t,nlx:nx,nly:ny,ly:y}};
 const t=e.type;
 if(t==='plane-mirror'||t==='screen'||isLens(e)){
  if(Math.abs(ux)>1e-9){const k=-lx/ux,y=ly+k*uy;if(Math.abs(y)<=hw)take(k,-1,0,y)}
 }else if(curved(e)){
  const R=2*e.f,Ra=Math.abs(R),h=mirHW(e),qx=lx+R,b=qx*ux+ly*uy,c2=qx*qx+ly*ly-R*R,D=b*b-c2;
  if(D>=0){const q=Math.sqrt(D);for(const k of[-b-q,-b+q]){const x=lx+k*ux,y=ly+k*uy;
   if(Math.abs(y)<=h&&(x+R)*Math.sign(R)>0)take(k,(-R-x)/R,-y/R,y)}}   // n = (C-P)/R : unit normal towards the reflecting face
 }else if(t==='glass-slab'){
  const hx=e.depth/2,hy=hw;
  for(const sg of[-1,1]){
   if(Math.abs(ux)>1e-9){const k=(sg*hx-lx)/ux,y=ly+k*uy;if(Math.abs(y)<=hy+1e-6)take(k,sg,0,y)}
   if(Math.abs(uy)>1e-9){const k=(sg*hy-ly)/uy,x=lx+k*ux;if(Math.abs(x)<=hx+1e-6)take(k,0,sg,0)}}
 }
 if(!best)return null;
 best.x=px+dx*best.t;best.y=py+dy*best.t;
 best.nx=best.nlx*c-best.nly*s;best.ny=best.nlx*s+best.nly*c;best.ldx=ux;best.ldy=uy;best.c=c;best.s=s;
 return best;
}
function diverges(e,x,y,r){ // outgoing ray moving away from the axis => its backward extension meets the axis behind the surface (virtual image)
 const l=toLocal(e,x,y),ry=-r[0]*Math.sin(e.angle)+r[1]*Math.cos(e.angle);
 return Math.abs(l.y)>.5&&Math.abs(ry)>1e-9&&(-l.y/ry)<0;}
function interact(e,h,dx,dy,virt){
 const dn=dx*h.nx+dy*h.ny,t=e.type;
 if(t==='plane-mirror'||curved(e)){
  if(dn>=0)return null;                                   // opaque back: absorbed
  const r=[dx-2*dn*h.nx,dy-2*dn*h.ny];
  if(t==='plane-mirror'||diverges(e,h.x,h.y,r))virt.push(h.x,h.y,h.x-r[0]*240,h.y-r[1]*240);
  return r;}
 if(t==='screen'){if(dn<0)e.hits.push(h.ly);return null}
 if(isLens(e)){                                           // thin lens: slope' = slope - y/f (exact in slope, any ray angle)
  const sg=Math.sign(h.ldx),m=h.ldy/h.ldx-sg*h.ly/e.f,L=Math.hypot(1,m),nx=sg/L,ny=sg*m/L;
  const r=[nx*h.c-ny*h.s,nx*h.s+ny*h.c];
  if(diverges(e,h.x,h.y,r))virt.push(h.x,h.y,h.x-r[0]*300,h.y-r[1]*300);
  return r;}
 if(t==='glass-slab'){                                    // Snell's law in vector form, with total internal reflection
  let N,n1,n2;if(dn<0){N=[h.nx,h.ny];n1=1;n2=e.n}else{N=[-h.nx,-h.ny];n1=e.n;n2=1}
  const ci=-(dx*N[0]+dy*N[1]),eta=n1/n2,k=1-eta*eta*(1-ci*ci);
  if(k<0)return[dx+2*ci*N[0],dy+2*ci*N[1]];
  const q=eta*ci-Math.sqrt(k);return[eta*dx+q*N[0],eta*dy+q*N[1]];}
 return null;
}
function traceSource(src){
 const rays=[],n=src.count;
 if(src.type==='laser'){const px=-Math.sin(src.angle),py=Math.cos(src.angle),dx=Math.cos(src.angle),dy=Math.sin(src.angle);
  for(let i=0;i<n;i++){const o=n>1?-src.size/2+src.size*i/(n-1):0;
   rays.push([src.x+dx*22+px*o,src.y+dy*22+py*o,dx,dy])}}
 else{const sp=src.spread*Math.PI/180,full=src.spread>=359;
  for(let i=0;i<n;i++){const a=n>1?src.angle-sp/2+sp*i/(full?n:n-1):src.angle;rays.push([src.x,src.y,Math.cos(a),Math.sin(a)])}}
 return traceRays(rays,src.color)}
function traceRays(rays,color,maxB=16){
 const segs=[],virt=[],norms=[];let hits=0,absorbed=false;
 for(let [x,y,dx,dy] of rays){
  for(let d=0;d<maxB;d++){
   let best=null,be=null;
   for(const e of els){if(isSrc(e)||e.type==='ruler'||e.type==='object')continue;const h=intersect(e,x,y,dx,dy);if(h&&(!best||h.t<best.t)){best=h;be=e}}
   const L=best?best.t:4000;segs.push(x,y,x+dx*L,y+dy*L);
   if(!best)break;
   hits++;norms.push(best.x,best.y,best.nx,best.ny);
   const nd=interact(be,best,dx,dy,virt);if(!nd){absorbed=true;break}
   dx=nd[0];dy=nd[1];x=best.x+dx*.02;y=best.y+dy*.02;
  }}
 return{color,segs,virt,norms,hits,absorbed};
}

/* ---- Theme ---- */
const THEMES={dark:{g1:'#141c2e',g2:'#1f2a44',axis:'rgba(148,163,184,.25)',mir:'#f1f5f9',pl:'#e2e8f0',slab:'#a7f3d0',scr:'#e2e8f0',cap:'#cbd5e1',ruler:'#fbbf24',lbl:'#94a3b8',virt:'rgba(216,180,254,.5)',rayOp:'lighter',spotOp:'lighter',spot0:'rgba(255,255,255,.55)',spot1:'rgba(255,255,255,0)',dim:1,bot:'#e2e8f0',bg:'#0b0f19'},
light:{g1:'#e2e8f0',g2:'#cbd5e1',axis:'rgba(71,85,105,.35)',mir:'#0f172a',pl:'#475569',slab:'#047857',scr:'#cbd5e1',cap:'#475569',ruler:'#b45309',lbl:'#64748b',virt:'rgba(109,40,217,.6)',rayOp:'source-over',spotOp:'source-over',spot0:'rgba(124,58,237,.65)',spot1:'rgba(124,58,237,0)',dim:.62,bot:'#334155',bg:'#f8fafc'}};
let T=THEMES[document.documentElement.dataset.theme]||THEMES.dark;
const rc=c=>{if(T.dim===1)return c;const n=parseInt(c.slice(1),16);return`rgb(${((n>>16)&255)*T.dim|0},${((n>>8)&255)*T.dim|0},${(n&255)*T.dim|0})`};
function setTheme(t,save=true){T=THEMES[t];document.documentElement.dataset.theme=t;if(save)try{localStorage.setItem('optics-theme',t)}catch(e){}
 $('b-theme').textContent=t==='dark'?'☀ Light mode':'🌙 Dark mode';document.querySelector('meta[name=theme-color]').content=T.bg}

/* ---- Objects and images (thin-lens / mirror equations, Cartesian frame of the optical element) ---- */
const optical=()=>els.filter(e=>isLens(e)||curved(e)||e.type==='plane-mirror');
const nearestOpt=(o,opt)=>opt.reduce((a,b)=>Math.hypot(a.x-o.x,a.y-o.y)<=Math.hypot(b.x-o.x,b.y-o.y)?a:b);
function pathHits(o){ // lenses/mirrors met, in order, by the axial ray (object base aimed at the nearest element's centre)
 const opt=optical();if(!opt.length)return[];const pb=toWorld(o,0,o.size/2),E0=nearestOpt(o,opt);
 let dx=E0.x-pb.x,dy=E0.y-pb.y,L=Math.hypot(dx,dy);if(L<1)return[];dx/=L;dy/=L;let x=pb.x,y=pb.y;const seq=[];
 for(let k=0;k<40&&seq.length<8;k++){
  let best=null,be=null;
  for(const e of els){if(isSrc(e)||e.type==='ruler'||e.type==='object')continue;const h=intersect(e,x,y,dx,dy);if(h&&(!best||h.t<best.t)){best=h;be=e}}
  if(!best||be.type==='screen')break;
  const nd=interact(be,best,dx,dy,[]);
  if(nd&&(isLens(be)||curved(be)||be.type==='plane-mirror'))seq.push({E:be,d:Math.sign(best.ldx)||1});
  if(!nd)break;dx=nd[0];dy=nd[1];x=best.x+dx*.02;y=best.y+dy*.02}
 return seq}
let refE=null,princ=[],farF=null;
function traceObject(o){ refE=null;princ=[];farF=null; // principal rays (vs. the nearest element) plus a fan across its aperture when several elements are chained; up to 40 interactions each

function drawSel(){
 if(!sel)return;const b=bounds(sel);ctx.save();ctx.translate(sel.x,sel.y);ctx.rotate(sel.angle);
 ctx.strokeStyle='#38bdf8';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.strokeRect(-b.hx-8,-b.hy-8,2*b.hx+16,2*b.hy+16);ctx.setLineDash([]);
 const h=handleLocal(sel);ctx.beginPath();ctx.moveTo(isSrc(sel)?b.hx+8:0,isSrc(sel)?0:-b.hy-8);ctx.lineTo(h.x,h.y);ctx.stroke();
 ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(h.x,h.y,8,0,TAU);ctx.fill();ctx.restore();
}
function drawGrid(){
 if(!showGrid)return;ctx.save();ctx.lineWidth=1;
 for(const[step,col]of[[20,T.g1],[100,T.g2]]){ctx.strokeStyle=col;ctx.beginPath();
  for(let x=0;x<W;x+=step){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}for(let y=0;y<H;y+=step){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}ctx.stroke()}
 ctx.restore();
}
function frame(ts){
 fc++;if(ts-lt>=1000){$('s-fps').textContent=fc;fc=0;lt=ts}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);drawGrid();
 els.forEach(e=>{if(e.type==='screen')e.hits=[]});
 const res=els.filter(isSrc).map(traceSource);if(showOR)els.forEach(e=>{if(e.type==='object')res.push(...traceObject(e))});
 els.forEach(drawEl);drawPlane();drawRays(res);const an=analyse();drawVirtExt(an);drawImage(an);showCard(an);drawSel();
 $('s-rays').textContent=res.reduce((a,r)=>a+r.segs.length/4,0);$('s-hits').textContent=res.reduce((a,r)=>a+r.hits,0);
 if(sel&&sel.type==='screen'){const s=document.querySelector('[data-v=spot]');if(s){const h=sel.hits;s.textContent=h.length?`${h.length} rays, spread ${(Math.max(...h)-Math.min(...h)).toFixed(1)} px`:'no light'}}
 requestAnimationFrame(frame);
}

/* ---- Interaction ---- */
const pos=ev=>{const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}};
const pick=(m,pad=8)=>{for(let i=els.length-1;i>=0;i--){const e=els[i],l=toLocal(e,m.x,m.y),b=bounds(e);if(Math.abs(l.x)<=b.hx+pad&&Math.abs(l.y)<=b.hy+pad)return e}return null};
cv.addEventListener('pointerdown',ev=>{
 const m=pos(ev);
 if(sel){const h=handleLocal(sel),w=toWorld(sel,h.x,h.y);
  if(Math.hypot(m.x-w.x,m.y-w.y)<(ev.pointerType==='touch'?28:16)){drag={mode:'rot',off:Math.atan2(m.y-sel.y,m.x-sel.x)-sel.angle};cv.setPointerCapture(ev.pointerId);return}}
 const f=pick(m,ev.pointerType==='touch'?18:8);
 if(f){sel=f;drag={mode:'move',dx:m.x-f.x,dy:m.y-f.y};cv.setPointerCapture(ev.pointerId)}else sel=null;
 buildInspector();
});
cv.addEventListener('pointermove',ev=>{
 const m=pos(ev);
 if(!drag){cv.style.cursor=pick(m)?'grab':'default';return}
 if(drag.mode==='rot'){let a=Math.atan2(m.y-sel.y,m.x-sel.x)-drag.off;if(ev.shiftKey){const st=Math.PI/12;a=Math.round(a/st)*st}
  sel.angle=Math.atan2(Math.sin(a),Math.cos(a));}
 else{let x=m.x-drag.dx,y=m.y-drag.dy;if(showGrid){x=g(x);y=g(y)}sel.x=x;sel.y=y}
 refresh();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));
addEventListener('keydown',ev=>{
 if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;
 if((ev.key==='Delete'||ev.key==='Backspace')&&sel){remove(sel)}if(ev.key==='Escape'){sel=null;buildInspector()}
});
function remove(e){els=els.filter(x=>x!==e);sel=null;buildInspector()}

/* ---- Inspector ---- */
const ICON={object:'<path d="M10 2h4M10 2v4c0 2-3 3-3 6v8a2 2 0 002 2h6a2 2 0 002-2v-8c0-3-3-4-3-6V2"/><path d="M7 14h10"/>',laser:'<rect x="2" y="8" width="9" height="8" rx="2"/><path d="M13 9h9M13 12h9M13 15h9"/>',
'point-light':'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>',
'plane-mirror':'<path d="M9 3v18"/><path d="M9 6l4-3M9 11l4-3M9 16l4-3M9 21l4-3"/>',
'concave-mirror':'<path d="M8 3Q18 12 8 21"/><path d="M14 7l4-3M16 12l4-3M14 17l4-3"/>',
'convex-mirror':'<path d="M14 3Q4 12 14 21"/><path d="M16 7l4-3M16 12l4-3M16 17l4-3"/>',
'convex-lens':'<path d="M12 2Q21 12 12 22Q3 12 12 2Z"/>','concave-lens':'<path d="M6 3h12Q14 12 18 21H6Q10 12 6 3Z"/>',
'glass-slab':'<rect x="6" y="4" width="12" height="16" rx="1.5"/><path d="M2 9l4 1M18 11l4 1.5"/>',
screen:'<path d="M4 4h16"/><rect x="6" y="5" width="12" height="9"/><path d="M12 14v5M8 22l4-3 4 3"/>',
ruler:'<rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/>'};
const PAL=[['Light sources',['laser','point-light']],['Objects',['object']],['Mirrors',['plane-mirror','concave-mirror','convex-mirror']],
 ['Lenses and media',['convex-lens','concave-lens','glass-slab']],['Detectors and tools',['screen','ruler']]];
$('palette').innerHTML=PAL.map(([h,l])=>`<div class="sec"><div class="sh text-xs font-semibold text-slate-400 mb-1">${h}</div><div class="row flex flex-wrap gap-1.5">`+
 l.map(t=>`<button class="pb" data-add="${t}"><svg viewBox="0 0 24 24">${ICON[t]}</svg>${LABEL[t]}</button>`).join('')+'</div></div>').join('');
$('palette').addEventListener('click',ev=>{const b=ev.target.closest('[data-add]');if(!b)return;
 const k=els.length%6*20;sel=new El(b.dataset.add,g(W/2)+k,g(H/2)+k);els.push(sel);buildInspector()});

const FMT={pos:e=>`${Math.round(e.x)}, ${Math.round(e.y)}`,angle:e=>Math.round(e.angle*180/Math.PI)+'°',size:e=>Math.round(e.size)+' px',
 f:e=>Math.round(e.f)+' px',n:e=>e.n.toFixed(2),depth:e=>Math.round(e.depth)+' px',spread:e=>Math.round(e.spread)+'°',count:e=>e.count,spot:()=>'',R:e=>Math.round(trueR(e))+' px',
 rnote:e=>isLens(e)&&trueR(e)<e.size*1.3-.5?'Drawn slimmer than the true shape (display limit). The true R is shown above; the ray maths uses f only.':''};
const sl=(l,p,min,max,step,val,deg)=>`<div><label class="flex justify-between text-slate-400 mb-1"><span>${l}</span><span class="mono text-cyan-300" data-v="${p}"></span></label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-p="${p}"${deg?' data-deg="1"':''}></div>`;
function applyInsp(){$('insp').classList.toggle('hide',insHidden);$('insp-open').classList.toggle('hidden',!(insHidden&&sel))}
function buildInspector(){
 const box=$('insp');box.classList.toggle('empty',!sel);applyInsp();
 if(!sel){box.innerHTML='<p class="text-slate-500 italic text-center py-6">Select an element to edit its properties.</p>';return}
 const e=sel,t=e.type,SZ={object:['Height',40,280],laser:['Beam width',10,240],ruler:['Length',100,600],'glass-slab':['Height',40,300]}[t]||['Aperture',40,400];
 let h=`<div class="flex justify-between items-center bg-slate-800/60 border border-slate-700 rounded-lg p-2"><b class="text-cyan-400">${LABEL[t]}</b><span class="flex gap-3"><button id="del" class="text-rose-400 hover:text-rose-300">Delete</button><button id="insp-x" class="text-slate-400">Hide ✕</button></span></div>
 <div class="flex justify-between text-slate-400"><span>Position</span><span class="mono text-cyan-300" data-v="pos"></span></div>`;
 h+=sl('Angle','angle',-180,180,1,Math.round(e.angle*180/Math.PI),1);
 if(t!=='point-light')h+=sl(SZ[0],'size',SZ[1],SZ[2],t==='object'?40:1,e.size);
 if(t==='point-light')h+=sl('Spread angle','spread',5,360,1,e.spread);
 if(isSrc(e)){h+=sl('Ray count','count',1,61,1,e.count)+'<div class="flex gap-2">'+['#00ffcc','#ff4d6d','#4d9bff','#ffd23f'].map(c=>`<button data-c="${c}" class="w-6 h-6 rounded-full border-2 border-slate-600" style="background:${c}"></button>`).join('')+'</div>'}
 if(t==='object')h+='<div class="flex gap-2"><button class="tb'+(e.style!=='arrow'?' on':'')+'" data-st="bottle">Coke bottle</button><button class="tb'+(e.style==='arrow'?' on':'')+'" data-st="arrow">Arrow</button></div><p class="text-slate-500">Stand the base on the dashed optical axis. Three principal rays leave the tip: parallel (red), through the centre (yellow), through the focus (blue).</p>';
 if(isLens(e)||curved(e)){const fa=Math.abs(e.f),lo=Math.max(1,Math.min(20,Math.floor(fa))),hi=Math.max(400,Math.ceil(fa));
  h+=sl('Focal length f','f',e.f>0?lo:-hi,e.f>0?hi:-lo,1,e.f)}
 if(isLens(e)){const sh=e.lock==='shape';
  h+=`<div class="flex gap-2"><button class="tb${sh?' on':''}" data-lock="shape">Hold shape</button><button class="tb${sh?'':' on'}" data-lock="f">Hold f</button></div>`
  +sl(sh?'Refractive index n (changes f)':'Refractive index n (redraws curvature)','n',1.1,2.5,.01,e.n)
  +'<div class="flex justify-between text-slate-400"><span>Radius of curvature R</span><span class="mono text-cyan-300" data-v="R"></span></div><div class="text-amber-400" data-v="rnote"></div>'
  +(sh?'<p class="text-slate-500">Hold shape (real glass): R stays fixed, so a higher n gives a shorter f, from 1/f = 2(n−1)/R. Dragging the f slider re-grinds the lens to a new R.</p>'
      :'<p class="text-slate-500">Hold f: f is the control and the curvature is redrawn as R = 2(n−1)f so f never changes. A real lens of fixed shape would change f with n.</p>')
  +'<p class="text-slate-500">Thin-lens model in air: thickness and colour (dispersion) are ignored.</p>'}
 if(t==='glass-slab')h+=sl('Refractive index n','n',1,2.5,.01,e.n)+sl('Thickness','depth',20,300,1,e.depth);
 if(curved(e)||t==='plane-mirror')h+='<p class="text-slate-500">Silver edge = reflecting face (arrives from the left at 0°). Hatched side is the opaque back.</p>';
 if(curved(e))h+='<p class="text-slate-500">Exact spherical surface (R = 2f): wide apertures and tall objects show real spherical aberration and field curvature.</p>';
 if(t==='screen')h+='<div class="flex justify-between text-slate-400"><span>Spot</span><span class="mono text-violet-300" data-v="spot"></span></div>';
 box.innerHTML=h;refresh();
}
function refresh(){
 if(!sel)return;$('insp').querySelectorAll('[data-v]').forEach(s=>{if(s.dataset.v!=='spot')s.textContent=FMT[s.dataset.v](sel)});
 const a=$('insp').querySelector('[data-p=angle]');if(a)a.value=Math.round(sel.angle*180/Math.PI);
}
function syncF(){const fs=$('insp').querySelector('[data-p=f]');if(!fs)return;
 const a=Math.abs(sel.f),lo=Math.max(1,Math.min(20,Math.floor(a))),hi=Math.max(400,Math.ceil(a));
 fs.min=sel.f>0?lo:-hi;fs.max=sel.f>0?hi:-lo;fs.value=sel.f}
$('insp').addEventListener('input',ev=>{const t=ev.target,p=t.dataset.p;if(!sel||!p)return;
 let v=parseFloat(t.value);if(t.dataset.deg)v=v*Math.PI/180;const old=sel[p];sel[p]=v;
 if(isLens(sel)&&sel.lock==='shape'){
  if(p==='n'){if(!sel.R)sel.R=2*(old-1)*Math.abs(sel.f);          // freeze the glass shape at the old n
   sel.f=Math.sign(sel.f)*sel.R/(2*(sel.n-1));syncF()}            // f = R / (2(n-1))
  else if(p==='f')sel.R=2*(sel.n-1)*Math.abs(sel.f)}              // moving f re-grinds the lens
 refresh()});
$('insp').addEventListener('click',ev=>{if(ev.target.id==='del')remove(sel);if(ev.target.id==='insp-x'){insHidden=true;tog('b-insp','Properties: ',()=>!insHidden);applyInsp()}if(ev.target.dataset.c&&sel)sel.color=ev.target.dataset.c;if(ev.target.dataset.st&&sel){sel.style=ev.target.dataset.st;buildInspector()}
 if(ev.target.dataset.lock&&sel){sel.lock=ev.target.dataset.lock;sel.R=null;buildInspector()}});

/* ---- Toolbar and presets ---- */
const tog=(id,txt,get)=>{const b=$(id);b.classList.toggle('on',get());b.textContent=txt+(get()?'on':'off')};
$('b-grid').onclick=()=>{showGrid=!showGrid;tog('b-grid','Grid snap: ',()=>showGrid)};
$('b-norm').onclick=()=>{showN=!showN;tog('b-norm','Normals: ',()=>showN)};
$('b-virt').onclick=()=>{showV=!showV;tog('b-virt','Virtual rays: ',()=>showV)};
$('b-orays').onclick=()=>{showOR=!showOR;tog('b-orays','Object rays: ',()=>showOR)};
$('b-img').onclick=()=>{showImg=!showImg;tog('b-img','Image: ',()=>showImg)};
$('card-t').onclick=()=>{cardOpen=!cardOpen;paintCard()};
$('b-insp').onclick=()=>{insHidden=!insHidden;tog('b-insp','Properties: ',()=>!insHidden);applyInsp()};
$('insp-open').onclick=()=>{insHidden=false;tog('b-insp','Properties: ',()=>!insHidden);applyInsp()};
$('b-theme').onclick=()=>setTheme(T===THEMES.dark?'light':'dark');
$('b-clear').onclick=()=>{els=[];sel=null;buildInspector()};
$('dens').oninput=ev=>{density=+ev.target.value;$('denslbl').textContent=density;els.forEach(e=>{if(isSrc(e))e.count=density});if(sel&&isSrc(sel))buildInspector()};
$('preset').onchange=ev=>{if(ev.target.value)load(ev.target.value);ev.target.value=''};
function load(p){
 const cx=g(W/2),cy=g(H/2),mk=(t,x,y,o={})=>{const e=new El(t,g(x),g(y));Object.assign(e,o);els.push(e);return e};
 els=[];sel=null;
 if(p==='lens'){mk('laser',W*.15,cy,{size:100});const l=mk('convex-lens',W*.45,cy,{f:160,size:200});mk('screen',l.x+160,cy,{size:200})}
 else if(p==='slab'){mk('laser',W*.2,H*.3,{angle:.55,size:40,count:5});mk('glass-slab',W*.5,H*.55,{size:220,depth:140})}
 else if(p==='concave'){mk('laser',W*.12,cy-80,{size:60});mk('concave-mirror',W*.72,cy,{f:150,size:220})}
 else if(p==='convex'){mk('laser',W*.12,cy-80,{size:60});mk('convex-mirror',W*.72,cy,{f:-150,size:220})}
 else if(p==='virtual'){const m=mk('concave-mirror',W*.7,cy,{f:150,size:220});mk('point-light',m.x-80,cy,{spread:50,count:11})}
 else if(p==='b-lens'){ // F < u < 2F; short f, tall slim lens whose aperture covers every principal ray
  const sc=Math.min(1,(W-70)/560,H/560),f=20*Math.max(3,Math.round(4*sc)),u=Math.max(f+20,Math.round(1.75*f/20)*20),v=f*u/(u-f),k=f/(u-f);
  let os=40*Math.max(2,Math.round(3*sc));while(os>40&&Math.max(os,k*os)+30>cy-20)os-=40;      // focal ray meets the lens at height k*os
  const ap=Math.min(2*(cy-16),20*Math.ceil(2*(Math.max(os,k*os)+30)/20)),l=mk('convex-lens',W/2-(v-u)/2,cy,{f,size:ap});mk('object',l.x-u,cy-os/2,{size:os})}
 else if(p==='b-concave'){const m=mk('concave-mirror',W*.8,cy,{f:150,size:240});mk('object',m.x-240,cy-60,{size:120})}
 else if(p==='b-magnify'){const m=mk('concave-mirror',W*.7,cy,{f:150,size:240});mk('object',m.x-80,cy-40,{size:80})}
 else if(p==='b-plane'){const m=mk('plane-mirror',W*.6,cy,{size:260});mk('object',m.x-160,cy-60,{size:120})}
 else if(p==='b-magnifier'){const l=mk('convex-lens',W*.55,cy,{f:120,size:340});mk('object',l.x-80,cy-60,{size:120})}
 else if(p==='b-cclens'){const l=mk('concave-lens',W*.5,cy,{f:-100,size:300});mk('object',l.x-200,cy-60,{size:120})}
 else if(p==='b-cvmirror'){const m=mk('convex-mirror',W*.72,cy,{f:-150,size:300});mk('object',m.x-260,cy-60,{size:120})}
 else if(p==='b-two'){const a=mk('convex-lens',W*.25,cy,{f:120,size:220}),b=mk('convex-lens',a.x+440,cy,{f:80,size:200});mk('object',a.x-200,cy-40,{size:80})}
 else if(p==='b-lm'){const l=mk('convex-lens',W*.28,cy,{f:140,size:220});mk('concave-mirror',l.x+560,cy,{f:150,size:240});mk('object',l.x-240,cy-40,{size:80})}
 else if(p==='periscope'){mk('laser',W*.15,H*.7,{size:40,count:7});mk('plane-mirror',W*.5,H*.7,{angle:Math.PI/4,size:120});
  mk('plane-mirror',W*.5,H*.25,{angle:-3*Math.PI/4,size:120});mk('screen',W*.85,H*.25,{size:160})}
 buildInspector();
}

/* ---- Boot ---- */
function resize(){W=stage.clientWidth;H=stage.clientHeight;dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px'}
new ResizeObserver(resize).observe(stage);resize();setTheme(document.documentElement.dataset.theme,false);load('b-lens');requestAnimationFrame(frame);
</script>
</body>
