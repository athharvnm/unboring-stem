<script>
(function () {
'use strict';

/* ---------- text formatting ---------- */
function cleanTeX(expr) {
  return String(expr)
    .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1)/($2)')
    .replace(/\\text\{([^}]+)\}/g, '$1')
    .replace(/\\triangle/g, '△').replace(/\\angle/g, '∠').replace(/\\perp/g, '⊥')
    .replace(/\\sim/g, '∼').replace(/\\cong/g, '≅').replace(/\\approx/g, '≈')
    .replace(/\\times/g, '×').replace(/\\cdot/g, '·').replace(/\\neq/g, '≠')
    .replace(/\\implies/g, '⇒').replace(/\\circ/g, '°')
    .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>').replace(/\^([0-9a-zA-Z°])/g, '<sup>$1</sup>')
    .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>').replace(/_([0-9a-zA-Z])/g, '<sub>$1</sub>')
    .replace(/[{}]/g, '').trim();
}
function formatMathText(raw) {
  if (!raw) return '';
  return String(raw)
    .replace(/\$\$([\s\S]*?)\$\$/g, (_, e) => '<span class="inline-block my-1 px-2 py-0.5 rounded bg-[#F3EFE6] font-mono-tech text-sm">' + cleanTeX(e) + '</span>')
    .replace(/\$([^$]+?)\$/g, (_, e) => '<span class="font-mono-tech text-[0.92em]">' + cleanTeX(e) + '</span>');
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- geometry helpers ---------- */
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
function angleDeg(p1, v, p2) {
  const ax = p1.x - v.x, ay = p1.y - v.y, bx = p2.x - v.x, by = p2.y - v.y;
  const n1 = Math.hypot(ax, ay), n2 = Math.hypot(bx, by);
  if (n1 < 1e-5 || n2 < 1e-5) return 0;
  return Math.acos(Math.max(-1, Math.min(1, (ax * bx + ay * by) / (n1 * n2)))) * 180 / Math.PI;
}
function normalizeAngle(a) { let r = a % (Math.PI * 2); if (r < 0) r += Math.PI * 2; return r; }
function wrapPi(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
const circlePt = (cx, cy, r, t) => ({ x: cx + r * Math.cos(t), y: cy + r * Math.sin(t) });
function lineIntersect(p1, p2, p3, p4) {
  const d = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
  if (Math.abs(d) < 1e-6) return { x: (p1.x + p3.x) / 2, y: (p1.y + p3.y) / 2 };
  const t = ((p1.x - p3.x) * (p3.y - p4.y) - (p1.y - p3.y) * (p3.x - p4.x)) / d;
  return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
}
const fmtAng = (v) => (Number.isFinite(+v) ? (+v).toFixed(1) : '0.0') + '°';
const fmtLen = (px, g) => (px / Math.max(1, g.scale)).toFixed(2) + ' u';
const fmtProd = (a, b, g) => ((a / Math.max(1, g.scale)) * (b / Math.max(1, g.scale))).toFixed(2) + ' u²';

// Keep a point on an arc: angle measured from `from` going positively up to `to`
function clampArc(from, to, ang, margin) {
  const span = normalizeAngle(to - from);
  const n = Math.max(margin, Math.min(span - margin, normalizeAngle(ang - from)));
  return from + n;
}
// Cyclic quadrilateral vertices sorted around the circle so A,B,C,D are always in order
function quadPts(st, g) {
  return ['a', 'b', 'c', 'd'].map((k) => ({ k, th: normalizeAngle(st[k]) }))
    .sort((x, y) => x.th - y.th)
    .map((o) => ({ k: o.k, pt: circlePt(g.cx, g.cy, g.r, o.th) }));
}
const QCOL = ['#B84A27', '#5E5A51', '#2F6F5E', '#5E5A51'];
function quadHandles(st, g, keys) {
  return quadPts(st, g).map((o, i) => ({ id: o.k, label: 'ABCD'[i], pt: o.pt, color: QCOL[i] })).filter((h) => keys.includes(h.id));
}
// Tangent external point, kept inside the canvas
function tPoint(st, g) {
  const c = Math.cos(st.tilt), s = Math.sin(st.tilt), m = 34 * g.dpr;
  let lim = 1e9;
  if (Math.abs(c) > 1e-3) lim = Math.min(lim, (g.cx - m) / Math.abs(c));
  if (Math.abs(s) > 1e-3) lim = Math.min(lim, (g.cy - m) / Math.abs(s));
  const d = Math.max(g.r * 1.25, Math.min(g.r * st.distFactor, lim));
  return { x: g.cx + d * c, y: g.cy + d * s };
}
// Secant from P with direction = (towards centre) + delta; returns near and far hits
function secantHits(P, g, delta) {
  const th = Math.atan2(g.cy - P.y, g.cx - P.x) + delta;
  const u = { x: Math.cos(th), y: Math.sin(th) };
  const w = { x: P.x - g.cx, y: P.y - g.cy };
  const b = u.x * w.x + u.y * w.y, c = w.x * w.x + w.y * w.y - g.r * g.r;
  const s = Math.sqrt(Math.max(0, b * b - c));
  return {
    near: { x: P.x + (-b - s) * u.x, y: P.y + (-b - s) * u.y },
    far: { x: P.x + (-b + s) * u.x, y: P.y + (-b + s) * u.y }
  };
}
const extP = (st, g) => circlePt(g.cx, g.cy, g.r * st.pDist, st.pAng);
function secDrag(key) {
  return (st, k, ang, g, pt) => {
    const P = extP(st, g);
    const base = Math.atan2(g.cy - P.y, g.cx - P.x);
    st[key] = Math.max(-0.45, Math.min(0.45, wrapPi(Math.atan2(pt.y - P.y, pt.x - P.x) - base)));
  };
}
// Chord handles p1 (start) and p2 (end) – shared by c10 and b3
function chordDrag(st, k, ang) {
  if (k === 'p1') {
    const end = st.rot + st.span / 2;
    st.span = Math.max(0.3, Math.min(2.8, normalizeAngle(end - ang)));
    st.rot = end - st.span / 2;
  } else {
    const start = st.rot - st.span / 2;
    st.span = Math.max(0.3, Math.min(2.8, normalizeAngle(ang - start)));
    st.rot = start + st.span / 2;
  }
}
function chordHandles(st, g) {
  return [
    { id: 'p1', label: 'A', pt: circlePt(g.cx, g.cy, g.r, st.rot - st.span / 2), color: '#B84A27' },
    { id: 'p2', label: 'B', pt: circlePt(g.cx, g.cy, g.r, st.rot + st.span / 2), color: '#B84A27' }
  ];
}

/* ---------- drawing helpers ---------- */
function drawSegment(ctx, p1, p2, color, width, dashed) {
  ctx.save(); ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
  ctx.strokeStyle = color; ctx.lineWidth = width || 2;
  if (dashed) ctx.setLineDash([6, 5]);
  ctx.stroke(); ctx.restore();
}
function drawPoint(ctx, pt, label, color) {
  ctx.save(); ctx.beginPath(); ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = color || '#1C1B18'; ctx.fill();
  if (label) { ctx.font = '600 12px "JetBrains Mono", monospace'; ctx.fillStyle = '#1C1B18'; ctx.fillText(label, pt.x + 7, pt.y - 7); }
  ctx.restore();
}
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawBadge(ctx, pt, text, bg, fg) {
  ctx.save();
  const sc = Math.min(1.35, Math.max(1, ctx.canvas.width / 460));
  ctx.font = '700 ' + Math.round(14 * sc) + 'px "JetBrains Mono", monospace';
  const padX = Math.round(10 * sc), w = ctx.measureText(text).width + padX * 2, h = Math.round(28 * sc);
  const x = Math.max(8, Math.min(ctx.canvas.width - w - 8, pt.x - w / 2));
  const y = Math.max(8, Math.min(ctx.canvas.height - h - 8, pt.y - h / 2));
  ctx.fillStyle = bg || '#F9ECE7'; ctx.strokeStyle = fg || '#B84A27'; ctx.lineWidth = 1.5;
  roundRectPath(ctx, x, y, w, h, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = fg || '#B84A27'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2 + 0.5);
  ctx.restore();
}
const RB = '#F9ECE7', SB = '#EAF3F0', AC = '#B84A27', SG = '#2F6F5E', IK = '#1C1B18';

/* ---------- 12 core theorems ---------- */
const CORE_THEOREMS = [
{
  id: 'c1', num: '01', title: 'Angle at the Center Theorem',
  statement: 'The angle subtended by an arc at the center $O$ is twice the angle it subtends at any point on the remaining part of the circle.',
  invariantFormula: '∠AOB = 2 × ∠ACB',
  intuition: 'Moving $A$ or $B$ changes both angles together, and the central angle stays locked at double the inscribed one. Moving $C$ along the same arc does not change $\\angle ACB$ at all. If $C$ crosses onto the minor arc, the arc it faces becomes the major arc, so the central angle is the reflex angle.',
  proofSteps: [
    'Draw radius $CO$ and extend it past $O$ to form exterior angles on $\\triangle AOC$ and $\\triangle BOC$.',
    'Since $OA = OC = OB$ (radii), $\\triangle AOC$ and $\\triangle BOC$ are isosceles with equal base angles.',
    'Each exterior angle equals the sum of its two opposite interior angles, so $\\angle AOB = 2\\angle ACB$.'
  ],
  defaultState: { a: 2.35, b: 0.78, c: -1.35 },
  stepDemo(st, dt) { st.c += dt * 0.5; st.a += dt * 0.25; st.b -= dt * 0.22; },
  handles(st, g) {
    return [
      { id: 'a', label: 'A', pt: circlePt(g.cx, g.cy, g.r, st.a), color: AC },
      { id: 'b', label: 'B', pt: circlePt(g.cx, g.cy, g.r, st.b), color: AC },
      { id: 'c', label: 'C', pt: circlePt(g.cx, g.cy, g.r, st.c), color: SG }];
  },
  render(ctx, st, g, hl) {
    const o = { x: g.cx, y: g.cy };
    const A = circlePt(g.cx, g.cy, g.r, st.a), B = circlePt(g.cx, g.cy, g.r, st.b), C = circlePt(g.cx, g.cy, g.r, st.c);
    drawSegment(ctx, o, A, AC, hl ? 2.5 : 1.8); drawSegment(ctx, o, B, AC, hl ? 2.5 : 1.8);
    drawSegment(ctx, C, A, SG, hl ? 2.4 : 1.8); drawSegment(ctx, C, B, SG, hl ? 2.4 : 1.8);
    const insc = angleDeg(A, C, B);

function getCanvasGeometry(canvas) {
  const rect = canvas.getBoundingClientRect();
  const cssW = Math.max(260, rect.width || 520), cssH = Math.max(240, rect.height || 360);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  }
  const r = Math.min(canvas.width, canvas.height) * 0.31;
  return { ctx: canvas.getContext('2d'), width: canvas.width, height: canvas.height, dpr, cx: canvas.width / 2, cy: canvas.height / 2, r, scale: Math.max(12, r / 3.5) };
}

function getUniqueHandles(theorem, st, g) {

  return out;
}

      ctx.fillText(h.label, h.pt.x, h.pt.y + 0.5); ctx.restore();
    });
    els.readoutsGrid.innerHTML = metrics.map((m) => '<div class="math-chip"><span class="text-[#5E5A51]">' + escapeHtml(m.label) + ':</span> <strong>' + escapeHtml(m.value) + '</strong></div>').join('');
  } catch (err) { showNotice('Diagram rendering notice: ' + err.message); }
}

function renderSelectOptions() {
  els.theoremSelect.innerHTML = getCurrentList().map((t, i) => '<option value="' + i + '">' + t.num + ' · ' + escapeHtml(t.title) + '</option>').join('');
  els.theoremSelect.value = String(getCurrentIndex());
}

function renderIndexModalLists() {
  const build = (list, mode, cur, on, label) => list.map((t, i) => {
    const isCur = state.mode === mode && i === cur;
    return '<button type="button" data-mode="' + mode + '" data-idx="' + i + '" class="jump-item w-full text-left px-3.5 py-2.5 rounded-xl border text-sm flex items-center justify-between gap-2 cursor-pointer ' +
      (isCur ? on : 'bg-[#FAF8F4] text-[#1C1B18] border-[#E6E1D6] hover:bg-[#F3EFE6]') + '"><span class="font-medium">' + t.num + ' · ' + escapeHtml(t.title) + '</span><span class="font-mono-tech text-xs opacity-75">' + label + '</span></button>';
  }).join('');
  els.coreIndexList.innerHTML = build(CORE_THEOREMS, 'core', state.coreIndex, 'bg-[#1C1B18] text-white border-[#1C1B18]', 'Core');
  els.beyondIndexList.innerHTML = build(BEYOND_THEOREMS, 'beyond', state.beyondIndex, 'bg-[#2F6F5E] text-white border-[#2F6F5E]', 'Extended');
  document.querySelectorAll('.jump-item').forEach((btn) => btn.addEventListener('click', () => {
    state.mode = btn.getAttribute('data-mode');
    const i = Number(btn.getAttribute('data-idx')) || 0;
    if (state.mode === 'core') state.coreIndex = i; else state.beyondIndex = i;
    els.indexModal.classList.add('hidden'); renderAll();
  }));
}

function renderCheckSection(theorem) {
  const key = theorem.id, chosen = state.checkedAnswers[key];
  els.checkQuestion.innerHTML = formatMathText(theorem.check.q);
  els.checkOptions.innerHTML = theorem.check.options.map((opt, i) => {
    const cls = chosen === i ? 'border-[#1C1B18] bg-[#1C1B18] text-white' : 'border-[#E6E1D6] bg-[#FAF8F4] text-[#1C1B18] hover:bg-[#F3EFE6]';
    return '<button type="button" data-opt="' + i + '" class="check-opt-btn w-full text-left px-3.5 py-2.5 rounded-xl border text-sm font-medium cursor-pointer ' + cls + '">' + escapeHtml(opt) + '</button>';
  }).join('');
  document.querySelectorAll('.check-opt-btn').forEach((btn) => btn.addEventListener('click', () => {
    state.checkedAnswers[key] = Number(btn.getAttribute('data-opt')); renderCheckSection(theorem);
  }));
  if (typeof chosen === 'number') {
    const ok = chosen === theorem.check.answerIndex;
    els.checkFeedback.className = 'text-xs sm:text-sm p-3 rounded-xl leading-relaxed ' + (ok ? 'bg-[#EAF3F0] text-[#2F6F5E] border border-[#2F6F5E]/25' : 'bg-[#F9ECE7] text-[#B84A27] border border-[#B84A27]/25');
    els.checkFeedback.innerHTML = '<strong>' + (ok ? 'Accurate: ' : 'Check again: ') + '</strong>' + formatMathText(theorem.check.explain);
    els.masteredBadge.textContent = ok ? 'Verified' : 'Reviewed';
    els.masteredBadge.className = 'text-xs font-mono-tech px-2.5 py-1 rounded-full ' + (ok ? 'bg-[#EAF3F0] text-[#2F6F5E]' : 'bg-[#F9ECE7] text-[#B84A27]');
  } else {
    els.checkFeedback.className = 'hidden text-xs sm:text-sm p-3 rounded-xl leading-relaxed';
    els.masteredBadge.textContent = 'Unchecked';
    els.masteredBadge.className = 'text-xs font-mono-tech px-2.5 py-1 rounded-full bg-[#F3EFE6] text-[#5E5A51]';
  }
}

function renderAll() {
  const list = getCurrentList(), idx = getCurrentIndex(), th = list[idx];
  els.modeCoreBtn.classList.toggle('active', state.mode === 'core');
  els.modeBeyondBtn.classList.toggle('active', state.mode === 'beyond');
  els.progressCounter.textContent = (state.mode === 'core' ? 'Core ' : 'Beyond ') + (idx + 1) + ' / ' + list.length;
  els.theoremKicker.textContent = (state.mode === 'core' ? 'Core Circle Theorem ' : 'Extended Circle Theorem ') + th.num;
  els.theoremTitle.textContent = th.title;
  els.theoremStatement.innerHTML = formatMathText(th.statement);
  els.theoremInvariant.textContent = 'Invariant: ' + th.invariantFormula;
  els.intuitionText.innerHTML = formatMathText(th.intuition);
  els.proofStepsList.innerHTML = th.proofSteps.map((s) => '<li class="leading-relaxed">' + formatMathText(s) + '</li>').join('');
  els.toggleAnimBtn.textContent = state.autoDemo ? 'Pause' : 'Play';
  els.toggleAnimBtn.classList.toggle('is-paused', !state.autoDemo);
  els.speedBtn.textContent = 'Speed: ' + state.speed.toFixed(1) + '×';
  els.highlightStepBtn.textContent = state.highlightProof ? 'Highlight: On' : 'Highlight: Off';
  renderSelectOptions(); renderCheckSection(th); drawSceneFrame();
}

/* ---------- dragging ---------- */
function pointerToCanvasPt(evt, canvas) {
  const rect = canvas.getBoundingClientRect(), k = canvas.width / Math.max(1, rect.width);
  return { x: (evt.clientX - rect.left) * k, y: (evt.clientY - rect.top) * k };
}
function applyDrag(th, st, g, pt) {
  const k = state.draggingId, ang = Math.atan2(pt.y - g.cy, pt.x - g.cx);
  if (th.drag) th.drag(st, k, ang, g, pt);
  else st[k] = th.clamp ? th.clamp(st, ang) : ang;
}
els.geometryCanvas.addEventListener('pointerdown', (evt) => {
  const th = getCurrentTheorem(), st = getCurrentSceneState(), g = getCanvasGeometry(els.geometryCanvas);
  const pt = pointerToCanvasPt(evt, els.geometryCanvas);
  let hit = null, best = 28 * g.dpr;
  getUniqueHandles(th, st, g).forEach((h) => { const d = dist(pt, h.pt); if (d <= best) { best = d; hit = h.id; } });
  if (hit) {
    state.draggingId = hit; state.autoDemo = false;
    els.toggleAnimBtn.textContent = 'Play'; els.toggleAnimBtn.classList.add('is-paused');
    els.geometryCanvas.setPointerCapture(evt.pointerId);
  }
});
els.geometryCanvas.addEventListener('pointermove', (evt) => {
  if (!state.draggingId) return;
  const g = getCanvasGeometry(els.geometryCanvas);
  applyDrag(getCurrentTheorem(), getCurrentSceneState(), g, pointerToCanvasPt(evt, els.geometryCanvas));
  drawSceneFrame();
});
function stopDragging(evt) {
  if (state.draggingId) {
    state.draggingId = null;
    try { if (evt && evt.pointerId) els.geometryCanvas.releasePointerCapture(evt.pointerId); } catch (_) {}
  }
}
els.geometryCanvas.addEventListener('pointerup', stopDragging);
els.geometryCanvas.addEventListener('pointercancel', stopDragging);

/* ---------- controls ---------- */
els.brandHomeBtn.addEventListener('click', () => { state.mode = 'core'; state.coreIndex = 0; renderAll(); });
els.modeCoreBtn.addEventListener('click', () => { state.mode = 'core'; renderAll(); });
els.modeBeyondBtn.addEventListener('click', () => { state.mode = 'beyond'; renderAll(); });
els.prevTheoremBtn.addEventListener('click', () => setCurrentIndex(getCurrentIndex() - 1));
els.nextTheoremBtn.addEventListener('click', () => setCurrentIndex(getCurrentIndex() + 1));
els.theoremSelect.addEventListener('change', () => setCurrentIndex(Number(els.theoremSelect.value) || 0));
els.toggleAnimBtn.addEventListener('click', () => {
  state.autoDemo = !state.autoDemo;
  els.toggleAnimBtn.textContent = state.autoDemo ? 'Pause' : 'Play';
  els.toggleAnimBtn.classList.toggle('is-paused', !state.autoDemo);
});
els.speedBtn.addEventListener('click', () => {
  const sp = [0.6, 1.0, 1.8];
  state.speed = sp[(sp.indexOf(state.speed) + 1) % sp.length];
  els.speedBtn.textContent = 'Speed: ' + state.speed.toFixed(1) + '×';
});
els.resetSceneBtn.addEventListener('click', () => {
  state.sceneStates[state.mode][getCurrentIndex()] = Object.assign({}, getCurrentTheorem().defaultState);
  state.autoDemo = true; renderAll();
});
els.highlightStepBtn.addEventListener('click', () => {
  state.highlightProof = !state.highlightProof;
  els.highlightStepBtn.textContent = state.highlightProof ? 'Highlight: On' : 'Highlight: Off';
  drawSceneFrame();
});
els.openIndexBtn.addEventListener('click', () => { renderIndexModalLists(); els.indexModal.classList.remove('hidden'); });
els.closeIndexBtn.addEventListener('click', () => els.indexModal.classList.add('hidden'));
els.indexModal.addEventListener('click', (e) => { if (e.target === els.indexModal) els.indexModal.classList.add('hidden'); });
els.closeBannerBtn.addEventListener('click', () => els.statusBanner.classList.add('hidden'));
window.addEventListener('resize', drawSceneFrame);

let lastTime = performance.now();
function tick(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000)) * state.speed;
  lastTime = now;
  if (state.autoDemo && !state.draggingId) {
    const th = getCurrentTheorem();
    if (th.stepDemo) { th.stepDemo(getCurrentSceneState(), dt); drawSceneFrame(); }
  }
  requestAnimationFrame(tick);
}
renderAll();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
